<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sébastien Rondeau-Cameira — Accueil</title>
  <meta name="description" content="Bienvenue sur rondeau-cameira.fr. Retrouvez le site personnel de Sébastien Rondeau-Cameira.">
  <meta name="author" content="Sébastien RONDEAU-CAMEIRA">
  <link rel="canonical" href="https://www.rondeau-cameira.fr/">
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      color: #18283b;
      background: #f3f6fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
    }

    main { width: 100%; max-width: 42rem; }
    .domain { color: #526379; letter-spacing: 0.08em; }
    h1 { font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.15; overflow-wrap: anywhere; }
    p { max-width: 36rem; }

    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.85rem 1.2rem;
      border-radius: 0.5rem;
      color: #fff;
      background: #174d91;
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }

    a:hover { background: #103b72; }
    a:focus-visible { outline: 3px solid #a34b00; outline-offset: 5px; }

    @media (prefers-color-scheme: dark) {
      :root { color: #edf3fb; background: #101c2c; }
      .domain { color: #b2c2d7; }
      a { background: #245ea8; }
      a:hover { background: #2b6ec3; }
      a:focus-visible { outline-color: #ffbe73; }
    }
  </style>
</head>
<body>
  <main>
    <p class="domain">rondeau-cameira.fr</p>
    <h1>Sébastien Rondeau-Cameira</h1>
    <p>Bienvenue. Retrouvez mon site personnel en suivant le lien ci-dessous.</p>
    <a href="https://sebastien.rondeau-cameira.fr/">Consulter mon site personnel</a>
  </main>
</body>
</html>
